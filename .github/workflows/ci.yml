name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '55433'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Generate disposable PostgreSQL credentials
        shell: bash
        run: |
          test_password=$(openssl rand -hex 24)
          echo "::add-mask::$test_password"
          echo "TEST_POSTGRES_PASSWORD=$test_password" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL
        id: test_database
        run: docker compose -f compose.test.yaml up -d --wait --wait-timeout 120
      - name: Run real PostgreSQL integration tests
        run: pnpm test
      - name: Stop disposable PostgreSQL
        if: always() && steps.test_database.outcome != 'skipped'
        run: docker compose -f compose.test.yaml down
      - name: Build
        run: pnpm build
