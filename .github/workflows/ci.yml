name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: '55433'
      TEST_KEYCLOAK_PORT: '18081'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Install headless Chromium for Portal context verification
        timeout-minutes: 5
        # This hosted image already includes browser runtime libraries. Avoid
        # upgrading unrelated OS/fonts from a slow apt mirror; prove readiness.
        run: |
          pnpm exec playwright install --only-shell chromium
          pnpm exec node --input-type=module -e "import { chromium } from 'playwright'; const browser = await chromium.launch({ headless: true }); await browser.close();"
      - name: Generate disposable service credentials
        shell: bash
        run: |
          test_password=$(openssl rand -hex 24)
          echo "::add-mask::$test_password"
          echo "TEST_POSTGRES_PASSWORD=$test_password" >> "$GITHUB_ENV"
          identity_password=$(openssl rand -hex 24)
          echo "::add-mask::$identity_password"
          echo "TEST_KEYCLOAK_ADMIN_PASSWORD=$identity_password" >> "$GITHUB_ENV"
      - name: Start disposable PostgreSQL and Keycloak
        id: test_database
        run: docker compose -f compose.test.yaml up -d --wait --wait-timeout 180
      - name: Run PostgreSQL and OIDC integration tests
        run: pnpm security:matrix 3.1
      - name: Stop disposable PostgreSQL and Keycloak
        if: always() && steps.test_database.outcome != 'skipped'
        run: docker compose -f compose.test.yaml down
      - name: Build
        run: pnpm build

  clean-install:
    name: Clean install and recovery drill
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
        with:
          run_install: false
      - name: Install verifier and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --only-shell chromium
      - name: Verify fresh tree, empty PostgreSQL databases, Keycloak, apps and real recovery
        run: pnpm foundation:verify-clean
