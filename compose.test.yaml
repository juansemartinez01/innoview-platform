# Disposable integration PostgreSQL. Never attaches to development volumes.
name: innoview-platform-test
services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: test_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD for the disposable test server}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:-55433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U test_bootstrap -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
