# Disposable PostgreSQL and Keycloak contract fixtures. No development volumes.
name: innoview-platform-test
services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: test_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Set TEST_POSTGRES_PASSWORD for the disposable test server}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:-55433}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U test_bootstrap -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  keycloak-test:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--db=dev-mem']
    mem_limit: 1g
    environment:
      KC_HOSTNAME: http://127.0.0.1:${TEST_KEYCLOAK_PORT:-18081}
      KC_BOOTSTRAP_ADMIN_USERNAME: test_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TEST_KEYCLOAK_ADMIN_PASSWORD:?Set TEST_KEYCLOAK_ADMIN_PASSWORD for the disposable identity server}
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '127.0.0.1:${TEST_KEYCLOAK_PORT:-18081}:8080'
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q 'HTTP/1.1 200' <&3
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
