# Clean-install drill only: no persistent mounts, no development credentials.
services:
  postgres-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: test_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Inject disposable credential}
    ports:
      - '127.0.0.1:${TEST_DB_PORT:?Inject disposable port}:5432'
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U test_bootstrap -d postgres']
      interval: 2s
      timeout: 5s
      retries: 30
  postgres-identity-test:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_USER: clean_identity
      POSTGRES_DB: clean_identity
      POSTGRES_PASSWORD: ${TEST_IDENTITY_POSTGRES_PASSWORD:?Inject disposable credential}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -h 127.0.0.1 -U clean_identity -d clean_identity',
        ]
      interval: 2s
      timeout: 5s
      retries: 30
  keycloak-test:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev']
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-identity-test:5432/clean_identity
      KC_DB_USERNAME: clean_identity
      KC_DB_PASSWORD: ${TEST_IDENTITY_POSTGRES_PASSWORD:?Inject disposable credential}
      KC_HOSTNAME: http://127.0.0.1:${TEST_KEYCLOAK_PORT:?Inject disposable port}
      KC_BOOTSTRAP_ADMIN_USERNAME: test_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${TEST_KEYCLOAK_ADMIN_PASSWORD:?Inject disposable credential}
      KC_HEALTH_ENABLED: 'true'
    depends_on:
      postgres-identity-test:
        condition: service_healthy
    ports:
      - '127.0.0.1:${TEST_KEYCLOAK_PORT}:8080'
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000;
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q 'HTTP/1.1 200' <&3
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
